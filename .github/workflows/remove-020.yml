name: Remove version 0.2.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only Open VSX version 0.2.0
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          python <<'PY'
          import json, os, urllib.request
          base = 'https://open-vsx.org/api/kipngenokoech/weightless'
          with urllib.request.urlopen(base + '/0.1.9') as response:
              assert json.load(response)['version'] == '0.1.9'
          request = urllib.request.Request(base + '/delete', method='POST',
              data=json.dumps([{'version': '0.2.0'}]).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['OVSX_TOKEN'], 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
              assert not result.get('error'), result
          with urllib.request.urlopen(base + '/0.1.9') as response:
              assert json.load(response)['version'] == '0.1.9'
          print('Deleted only Open VSX version 0.2.0; 0.1.9 remains.')
          PY
